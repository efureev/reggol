version: "2"

run:
  modules-download-mode: readonly
  allow-parallel-runners: true

linters:
  # `standard` brings errcheck, govet, ineffassign, staticcheck and unused.
  # v0 ran with `default: none` and an explicit list that omitted staticcheck
  # and unused, which is why dead exported symbols and ST1005 violations
  # survived in a repository with 45 linters switched on.
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - dupl
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goheader
    - gomoddirectives
    - goprintffuncname
    - gosec
    - grouper
    - intrange
    - lll
    - makezero
    - misspell
    - mnd
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - nolintlint
    - perfsprint
    - predeclared
    - prealloc
    - reassign
    - revive
    - sloglint
    - unconvert
    - usestdlibvars
    - wastedassign
    - whitespace
    - wsl_v5

  settings:
    dupl:
      threshold: 100
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print(|ln))(# it looks like a forgotten debugging printing call)?$
    goconst:
      min-len: 2
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    godot:
      scope: declarations
      capital: false
    lll:
      line-length: 120
    misspell:
      locale: US
    nolintlint:
      require-specific: true
    perfsprint:
      # The whole point of the rewrite: no fmt on the hot path.
      strconcat: false
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - funlen
          - gochecknoglobals
          - gocognit
          - gocyclo
          - lll
          - mnd
          - wsl_v5
        path: _test\.go
      # The encoders are long, flat append chains by design; splitting them up
      # to satisfy a length metric would cost the allocation-free property.
      - linters:
          - funlen
          - gocognit
          - gocyclo
          - cyclop
        path: encoder_.*\.go
      - linters:
          - funlen
          - gocyclo
          - gocognit
        path: value\.go
      # The caller matrix puts the logging call and the expected position on one
      # line on purpose: that is what makes their line numbers identical, and it
      # is the only way to assert an exact call site without hard-coding numbers.
      - linters:
          - nlreturn
        path: (caller_test|log/log_test)\.go
      # Build-time tooling, not library code: the numbers here are SVG
      # coordinates and sample data, and printing to stdout is the point.
      # Correctness linters (staticcheck, errcheck, govet) still apply.
      - linters:
          - forbidigo
          - gochecknoglobals
          - intrange
          - mnd
          - wsl_v5
        path: ^scripts/
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
