name: Test

on: [push, pull_request]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-leaks:
    name: GitLeaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: gacts/gitleaks@v1 # Action page: <https://github.com/gacts/gitleaks>

  lint:
    name: Golang-CI (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      # Pinned to an exact patch, not the v2.7 range: a patch bump swaps the
      # bundled analyzers, and one silently turned on sixteen gosec findings
      # that no local run reproduced.
      - uses: golangci/golangci-lint-action@v9 # Action page: <https://github.com/golangci/golangci-lint-action>
        with: { version: v2.7.2 }

  # Correctness, including the concurrency guard. The race detector allocates on
  # its own, so allocation gates are excluded here and run in `alloc` instead.
  test:
    name: Test (race)
    strategy:
      matrix:
        go-version: [1.25.x, 1.26.x]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Test
        run: go test -race ./...

  # The blocking performance gate. Allocation counts are deterministic where
  # ns/op on a shared runner is not, so this is what CI enforces.
  alloc:
    name: Allocations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Zero-allocation gates
        # Matches every gate by suffix rather than by name: a new
        # Test*ZeroAllocations must not be able to slip past CI unnoticed.
        run: go test -run 'ZeroAllocations|PoolCeiling' -v ./...

  # Seed corpora only; a real fuzzing campaign belongs in a scheduled job.
  fuzz:
    name: Fuzz (seeds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Fuzz seeds
        run: go test -run 'Fuzz' ./...
      - name: Short fuzzing campaign
        run: |
          for target in FuzzParseLevel FuzzJSONEncoder FuzzTextEncoder FuzzValueAppend; do
            go test -run '^$' -fuzz="^${target}$" -fuzztime=30s .
          done

  # Blocking gate: no benchmark may allocate. Allocation counts are
  # deterministic where ns/op on a shared runner is not.
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Allocation gate
        run: ./scripts/check-allocs.sh ./...

      # Informational: timings against the base branch. Never gated — GitHub
      # runners are too noisy for a stable ns/op threshold.
      - name: Compare with the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          go test -run '^$' -bench=. -benchmem -benchtime=200ms -count=6 . > /tmp/head.txt
          git worktree add /tmp/base "${{ github.event.pull_request.base.sha }}"
          (cd /tmp/base && go test -run '^$' -bench=. -benchmem -benchtime=200ms -count=6 . > /tmp/base.txt)
          {
            echo '## Benchmarks vs base'
            echo '```'
            benchstat /tmp/base.txt /tmp/head.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # The profile is built here rather than by the action, which has no way to
      # exclude anything: scripts/ holds build tooling with no tests, and letting
      # it into the profile understated the library by about six points.
      - name: Build the coverage profile
        run: |
          go test -covermode=atomic -coverprofile=cover.out \
            $(go list ./... | grep -v '/scripts/')

      - name: Update coverage report
        uses: ncruces/go-coverage-report@main
        with:
          coverage-file: cover.out
          report: 'true'
          chart: 'true'
          amend: 'true'
        continue-on-error: true
